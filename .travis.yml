language: php

os:
  - linux

php:
  - '8.1'

notifications:
  email: bob_zy@yeah.net

install:
  - composer self-update --2

# Validate and build locally. Publishing remains an explicit operation using travis/deploy.php.
script:
  - |
    set -e
    for example in examples/tars-pb-server examples/TarsActDemo/QD.ActHttpServer examples/TarsActDemo/QD.ActCommentPbServer; do
      composer validate --no-check-publish --working-dir="$example/src"
      composer install --no-plugins --no-scripts --no-interaction --prefer-dist --working-dir="$example/src"
      composer check-platform-reqs --working-dir="$example/src"
      composer audit --working-dir="$example/src"
      php tests/protobuf-compatibility.php "$example/src"
      composer run deploy --working-dir="$example/src"
    done
